<div style="display:flex;flex-direction:column;gap:20px;">
  <div>
    <p style="font-size:13px;color:var(--text-secondary);margin:0 0 8px;">Primary</p>
    <div style="display:flex;gap:12px;">
      <div style="flex:1;background:#01773d;border-radius:12px;padding:16px;color:#F5F0E6;">
        <p style="font-weight:500;font-size:15px;margin:0;">Emerald green</p>
        <p style="font-size:13px;margin:4px 0 0;opacity:.9;">#01773D</p>
      </div>
    </div>
  </div>
  <div>
    <p style="font-size:13px;color:var(--text-secondary);margin:0 0 8px;">Secondary — luxury pairing</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">
      <div style="background:#C9A227;border-radius:12px;padding:16px;color:#3D2E00;">
        <p style="font-weight:500;font-size:14px;margin:0;">Antique gold</p>
        <p style="font-size:13px;margin:4px 0 0;">#C9A227</p>
      </div>
      <div style="background:#F5F0E6;border:0.5px solid var(--border);border-radius:12px;padding:16px;color:#3A3A32;">
        <p style="font-weight:500;font-size:14px;margin:0;">Ivory cream</p>
        <p style="font-size:13px;margin:4px 0 0;">#F5F0E6</p>
      </div>
      <div style="background:#1A1A1A;border-radius:12px;padding:16px;color:#EAEAEA;">
        <p style="font-weight:500;font-size:14px;margin:0;">Charcoal black</p>
        <p style="font-size:13px;margin:4px 0 0;">#1A1A1A</p>
      </div>
    </div>
  </div>
  <div>
    <p style="font-size:13px;color:var(--text-secondary);margin:0 0 8px;">Accent / alternate</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;">
      <div style="background:#0B2545;border-radius:12px;padding:16px;color:#DCE6F0;">
        <p style="font-weight:500;font-size:14px;margin:0;">Deep navy</p>
        <p style="font-size:13px;margin:4px 0 0;">#0B2545</p>
      </div>
      <div style="background:#E8DCC8;border-radius:12px;padding:16px;color:#4A3F2E;">
        <p style="font-weight:500;font-size:14px;margin:0;">Warm beige</p>
        <p style="font-size:13px;margin:4px 0 0;">#E8DCC8</p>
      </div>
    </div>
  </div>
</div>
